name: Validate catalog
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@395ad3262231945c25e8478fd5baf05154b1d79f # v6.1.0
        with:
          node-version: 24
      - run: python3 scripts/funds.py validate
      - run: python3 scripts/funds.py build --check
      - run: python3 scripts/catalog.py validate
      - run: python3 scripts/catalog.py build --check
      - run: python3 -m unittest discover -s tests
      - run: node --test tests/test_probe.mjs
      - run: >-
          python3 scripts/coverage.py
          --sources data/directory/2026-10-18
          --checks data/directory/2026-10-18/source-checks.jsonl
          --alternatives data/directory/2026-10-18/github-candidates.json
          --publisher-checks data/directory/2026-10-18/publisher-checks.jsonl
          --date 2026-10-18
          --output catalog-provider.json
          --summary coverage.json
          --gaps missing-logos.csv --check

      - run: python3 scripts/app_fallbacks.py --check
